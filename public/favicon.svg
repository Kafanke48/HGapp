<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- HGapp favicon: pokerski žeton, isti dizajn kot public/icons/*.png -->
  <rect width="64" height="64" fill="#0b1120" />
  <g transform="translate(32,32)">
    <!-- Telo žetona (tudi podlaga za rob - rdeča prosveti skozi vrzeli v belem robu spodaj) -->
    <circle r="27" fill="#ef4444" />
    <!-- Rob žetona: 8 izmenjujočih se segmentov, doseženo z belim črtkanim obročem čez rdečo podlago -->
    <circle r="21.6" fill="none" stroke="#f8fafc" stroke-width="10.8" stroke-dasharray="16.965 16.965" />
    <!-- Notranji svetel obroč -->
    <circle r="11.3" fill="#f8fafc" />
    <!-- Osrednja luknja -->
    <circle r="7.9" fill="#0b1120" />
  </g>
</svg>
